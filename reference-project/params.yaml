# Единственный источник правды по гиперпараметрам и путям.
# Правило курса: в коде нет магических чисел — всё сюда.

seed: 42

data:
  n_samples: 20000
  raw_path: data/raw/churn.csv
  processed_dir: data/processed
  test_size: 0.2
  val_size: 0.1

features:
  numeric:
    - tenure_months
    - monthly_charges
    - total_charges
    - num_support_calls
    - avg_monthly_gb
  categorical:
    - contract_type
    - internet_service
    - payment_method
  binary:
    - has_tech_support
    - is_senior

train:
  model: gradient_boosting      # logreg | random_forest | gradient_boosting
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3

evaluate:
  threshold: 0.5
  min_roc_auc: 0.75             # порог качества: ниже — CI падает

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: churn
  registered_model_name: churn-classifier

service:
  model_stage: Production
  model_path: models/model.joblib   # fallback, если MLflow недоступен
