# Правило курса: алерт должен звать человека, а не информировать его.
# Каждый алерт здесь отвечает на вопрос «что делать, когда он сработал».
groups:
  - name: churn-service
    rules:
      - alert: ServiceDown
        expr: up{job="churn-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис предсказаний недоступен"
          action: "Проверить docker compose ps и логи контейнера api"

      - alert: ModelNotLoaded
        expr: model_loaded == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Процесс жив, но модель не загружена"
          action: "Проверить доступность MLflow Registry и наличие models/model.joblib"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(prediction_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency превысил 500 мс"
          action: "Смотреть размер батчей и загрузку CPU контейнера"

      - alert: HighErrorRate
        expr: |
          sum(rate(prediction_requests_total{status="error"}[5m]))
          / clamp_min(sum(rate(prediction_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Более 5% запросов завершаются ошибкой"
          action: "Смотреть логи api, искать повторяющийся стектрейс"

      - alert: PredictionDistributionShift
        expr: |
          abs(
            histogram_quantile(0.5, sum(rate(prediction_probability_bucket[1h])) by (le))
            - histogram_quantile(0.5, sum(rate(prediction_probability_bucket[24h])) by (le))
          ) > 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Медиана предсказаний сдвинулась относительно суточной"
          action: "Запустить отчёт Evidently: make drift"
